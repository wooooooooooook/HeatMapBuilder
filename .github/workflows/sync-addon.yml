name: Deploy Add-on

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version increment type (patch/minor/major/none)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare add-on version
        id: version
        run: |
          CURRENT_VERSION=$(python -c "import json; print(json.load(open('hassio-addon/config.json', encoding='utf-8'))['version'])")
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"

          INCREMENT="${{ github.event.inputs.increment || 'none' }}"
          NEW_VERSION="$CURRENT_VERSION"

          if [ "$INCREMENT" = "major" ]; then
            major=$((major + 1))
            minor=0
            patch=0
            NEW_VERSION="$major.$minor.$patch"
          elif [ "$INCREMENT" = "minor" ]; then
            minor=$((minor + 1))
            patch=0
            NEW_VERSION="$major.$minor.$patch"
          elif [ "$INCREMENT" = "patch" ]; then
            patch=$((patch + 1))
            NEW_VERSION="$major.$minor.$patch"
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "Target version: $NEW_VERSION"

          if [ "$INCREMENT" != "none" ]; then
            export NEW_VERSION
            python -c "import json, os; path='hassio-addon/config.json'; data=json.load(open(path, encoding='utf-8')); data['version']=os.environ['NEW_VERSION']; json.dump(data, open(path, 'w', encoding='utf-8'), ensure_ascii=False, indent=2); open(path, 'a', encoding='utf-8').write('\n')"
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push version
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.increment != 'none' }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hassio-addon/config.json
          git commit -m "chore: bump addon version to $NEW_VERSION"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref }}

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: amd64
            platform: linux/amd64
          - ha_arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.ha_arch }}
        uses: docker/build-push-action@v5
        with:
          context: ./hassio-addon
          file: ./hassio-addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            nubiz/heatmapbuilder:${{ needs.prepare.outputs.version }}-${{ matrix.ha_arch }}
            nubiz/heatmapbuilder:latest-${{ matrix.ha_arch }}
          build-args: |
            BUILD_ARCH=${{ matrix.ha_arch }}
          cache-from: type=gha,scope=heatmapbuilder-${{ matrix.ha_arch }}
          cache-to: type=gha,mode=max,scope=heatmapbuilder-${{ matrix.ha_arch }}

  publish-manifest:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-arch manifests
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          IMAGES="nubiz/heatmapbuilder:latest-amd64 nubiz/heatmapbuilder:latest-aarch64"
          docker buildx imagetools create -t nubiz/heatmapbuilder:latest $IMAGES
          docker buildx imagetools create -t nubiz/heatmapbuilder:${VERSION} \
            nubiz/heatmapbuilder:${VERSION}-amd64 \
            nubiz/heatmapbuilder:${VERSION}-aarch64

  sync-addon-repo:
    needs: publish-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ github.ref }}

      - name: Checkout HAaddons
        uses: actions/checkout@v4
        with:
          repository: wooooooooooook/HAaddons
          token: ${{ secrets.ADDONS_REPO_TOKEN }}
          path: target

      - name: Sync HeatMapBuilder Add-on
        run: |
          rm -rf target/HeatMapBuilder
          mkdir -p target/HeatMapBuilder
          cp source/hassio-addon/config.json target/HeatMapBuilder/
          cp source/hassio-addon/README.md target/HeatMapBuilder/
          cp source/hassio-addon/CHANGELOG.md target/HeatMapBuilder/
          cp source/hassio-addon/icon.png target/HeatMapBuilder/
          cp source/hassio-addon/logo.png target/HeatMapBuilder/

          if [ -d source/hassio-addon/img ]; then
            cp -a source/hassio-addon/img target/HeatMapBuilder/
          fi

          if [ -d source/hassio-addon/translations ]; then
            cp -a source/hassio-addon/translations target/HeatMapBuilder/
          fi

          cd target
          if [[ -n $(git status -s) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Update HeatMapBuilder addon from source"
            git push
          else
            echo "No changes to sync."
          fi
